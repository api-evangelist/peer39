    repository: https://github.com/awhite07/peer39-mcp-connector
    url: https://github.com/awhite07/peer39-mcp-connector
    install: 'git clone; npm install (self-hosted service, not a library)'
    version: 0.1.0
    published: '2026-05-18'
    published_source: >-
      package.json version 0.1.0; last push 2026-05-18T19:20:37Z (GitHub API). No tags,
      no releases, no registry entry.
    license: UNLICENSED
    official: false
    kind: mcp-remote-server
    note: >-
      The remote/hosted sibling of the stdio server — an OAuth 2.1 authorization server
      plus streamable-HTTP MCP transport. Deployed for beta testers at
      https://mcp-connector.scatter-brain.ai, which is NOT a Peer39 domain.

