summary: >-
  Peer39 publishes NO client SDK to any public package registry. The only publicly
  installable first-party-authored artifact is the Peer39 MCP server, distributed
  straight from a GitHub tag via npx — not from npm. It is an agent tool server, not a
  language SDK, and it is not marked official because it lives on a personal account and
  its own README calls it pre-release.

packages:
  - language: javascript
    registry: github
    name: '@peer39/mcp-server'
    repository: https://github.com/awhite07/p39-custom-category-mcp
    url: https://github.com/awhite07/p39-custom-category-mcp
    install: 'npx -y github:awhite07/p39-custom-category-mcp#v1.0.9'
    version: 1.0.9
    published: '2026-07-14'
    published_source: >-
      git tag v1.0.9, committed 2026-07-14T18:02:02Z (GitHub API); package.json declares
      version 1.0.9. There is no registry metadata endpoint because the distribution is a
      GitHub tag, not a registry artifact.
    license: UNLICENSED
    official: false
    official_note: >-
      First-party-AUTHORED but not officially published. package.json names it
      "@peer39/mcp-server", the README calls it "UNLICENSED — internal Peer39 project" and
      says "Once we publish to npm under @peer39, the URL will change", and the repo
      homepage is app.peer39.com — but it is hosted on a personal GitHub account
      (awhite07), no github.com/peer39 organization exists, and Peer39 links to it from
      nowhere on www.peer39.com. Not counted as an official SDK.
    kind: mcp-server
    note: >-
      Wraps the Peer39 External API (https://app.peer39.com/api/external). Ten tools. The
      install URL is pinned to an immutable tag, so a consumer can tell exactly what they
      are getting.

  - language: javascript
    registry: github
