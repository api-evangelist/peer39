apis:
- aid: peer39-external-api
  name: Peer39 External API
  description: 'The Peer39 External API manages Custom Categories — contextual targeting
    and brand-safety lists of keywords, URLs, mobile apps or CTV apps — and syncs them to
    a connected DSP partner. Nine operations are known: session login, list/get/create/
    full-update/metadata-update/items-update/delete of custom categories, and a URL-example
    prediction preview. Authentication is a session bearer token obtained by POSTing a
    username and password to /api/external/login; the account must carry the "External API"
    and "RTB Buyer" roles, which are granted by a Peer39 integration manager. The API is
    credential-gated and publicly undocumented — Peer39 publishes no API reference page and
    no OpenAPI. This profile is derived from Peer39''s own publicly readable MCP server
    source plus live probes of the API host, and every path under /api/external returns
    HTTP 401 unauthenticated.'
  humanURL: https://app.peer39.com
  baseURL: https://app.peer39.com
