name: Peer39
description: 'Peer39 is a contextual advertising and intelligence company that provides
  pre-bid controls and post-buy analytics built on verified contextual data for programmatic
  media buyers. Its platform delivers contextual targeting, brand safety and suitability,
  and contextual analytics across web, mobile, and connected TV (CTV) and video environments,
  helping advertisers and platforms make privacy-forward, cookieless media decisions.
  Peer39 was surfaced as a portfolio company of Canaan Partners and added to the API
  Evangelist network. Peer39 does operate a real REST API — the Peer39 External API at
  https://app.peer39.com/api/external — for creating, updating and deleting Custom Categories
  (contextual targeting and brand-safety lists of keywords, URLs, mobile apps and CTV apps)
  and syncing them to connected DSPs such as The Trade Desk, Microsoft Advertising/Xandr,
  Basis, Yahoo and Amazon. That API is entirely undocumented in public: there is no developer
  portal, no API reference page, no OpenAPI specification and no published SDK. Credentials
  are provisioned by a Peer39 account or integration manager who grants the "External API"
  and "RTB Buyer" roles on a named account, and API documentation is distributed as PDFs
  rather than published on the web. A first-party-authored MCP server for the API exists in
  pre-release on a personal GitHub account and is the only public description of the surface.'
